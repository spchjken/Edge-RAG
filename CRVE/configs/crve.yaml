# CRVE Configuration: Context-Reranked Vocabulary Expansion (1st-Stage Retrieval)

vocabulary:
  pool_size: 10000
  scoring_function: "sublinear_salience" # IDF * ln(1 + DF)
  min_df: 1
  canonical_mapping: true

dense_matrix:
  model_name: "BAAI/bge-small-en-v1.5"
  device: "cuda"
  fp16: true
  batch_size: 256
  coverage_hubs: 2500

gate1_selection:
  default_proposer: "rrf_core"
  deployable_budget_l: 200
  rrf_k: 60
  channels:
    whole_query:
      enabled: true
      top_k: 500
    anchor_bge_filtered:
      enabled: true
      top_k: 500
      max_df_ratio: 0.12
      min_specificity: 0.65
    anchor_bge_all:
      enabled: true
      top_k: 500
    lexical_ppmi:
      enabled: true
      top_k: 500
      min_joint_support: 2

evaluation:
  harness: "pyterrier"
  jvm_memory_mb: 3072
  indexing_max_memory_bytes: 1073741824
  query_chunk_size: 200
  metrics:
    - "nDCG@10"
    - "R@100"
    - "R@200"
    - "R@500"
    - "R@1000"
    - "MRR@10"
