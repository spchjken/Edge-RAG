# configs/pyterrier_qe.yaml
# Project-fixed configuration for BGE_Vocab_QE and LLM_Q2E_ZS baselines
# Defined in docs/bgeqe_llmqe_testing_plan.md

bge_vocab_qe:
  encoder: "BAAI/bge-small-en-v1.5"
  vocab_cap: 15000
  min_cf: 3
  neighbour_depth_L: 50
  expansion_terms_ke: 10
  alpha: 0.60
  cache_dir: "data/cache/qe_vocab"
  batch_size: 64
  seed: 42

llm_q2e_zs:
  model_profile: "qwen3.5-4b"
  backend: "ollama"
  endpoint: "http://localhost:11434/api/generate"
  tag: "qwen3.5:4b"
  prompt_template: "Write only a comma-separated list of keywords for the following query. Do not output any intro, markdown, categories, or explanations:\n{query}"
  temperature: 0.0
  max_tokens: 64
  repetition_r: 5
  seed: 42
  think: false
  raw_cache_dir: "data/cache/qe_llm/raw"
  validated_cache_dir: "data/cache/qe_llm/validated"

retrieval:
  wmodel: "BM25"
  num_results: 1000
  chunk_size: 200
  seed: 42
