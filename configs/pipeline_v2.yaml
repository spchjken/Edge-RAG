# Hyperparameters for Pipeline V2 / V7 (5-Phase Anchored Lexical-Semantic Retriever)

pipeline_v2:
  schema: "BM25Dense_V7"  # Primary V7 Schema (Options: BM25Dense_V7, BM25Dense_AspectInject, BM25Dense_DynamicAspectInject)
  
  indexer:
    stemmer: "kstem"                 # IR stemmer: kstem (recommended) | snowball | porter | none
    use_wordnet_override: true       # WordNet suppletion override (went -> go, better -> good, children -> child)
    mode: "parity"                   # Inverted posting list mode: parity | legacy
    vocab_selection: "salience"      # Calibrated: salience (IDF * ln(1+DF)) beats pure coverage FPS
    max_vocab_pool_size: 2500        # Candidate vocabulary pool size extracted from corpus

  expansion:
    pos_ratios:
      noun: 1.0                      # Noun / Technical Entity POS Prior
      verb: 0.75                     # Verb POS Prior
      modifier: 0.60                 # Modifier / Other POS Prior
    tau_base: 0.55                   # Base Dual/Anchor Similarity cutoff
    delta_tau: 0.10                  # Calibrated: Delta_tau = +0.10 (rarer anchors -> stricter gate)
    beta: 1.0                        # Pure anchor-candidate similarity (1.0 = anchor-only, <1.0 = Dual-Sim)
    mu_ceil: 0.50                    # Query-level IT-MPE expansion budget ceiling (default: 0.50)
    eta: 0.0                         # IT-MPE budget direction (default: 0.0)
    mass_floor: 0.005                # Calibrated: mass_floor = 0.5% of w(a) (bounds |w_Q| and cuts latency in half)
    bailout_tau_idf: 3.0             # Anchor IDF threshold for triggering not-in-pool candidate bailout
    min_len_rescue: 3                # Minimum anchor length for bailout candidate generation
    bge_model_name: "BAAI/bge-small-en-v1.5"

  routing:
    tau_bypass: 0.75                 # Normalized BM25 score cutoff for direct answer bypass
    tau_discard: 0.15                # Normalized BM25 score cutoff for irrelevance discard

  vram:
    N_max: 10                        # Maximum target chunks passed to late expansion / LLM generation

